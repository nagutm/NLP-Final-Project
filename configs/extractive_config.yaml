# Extractive Model Configuration
# DeBERTa-v3-base for span extraction using question-answering approach

# Model Configuration
model_name: "microsoft/deberta-v3-base"
max_seq_length: 512

# Training Configuration
batch_size: 16
eval_batch_size: 32
num_epochs: 3
learning_rate: 2e-5
warmup_steps: 500
weight_decay: 0.01
gradient_accumulation_steps: 1

# Data Configuration
data_dir: "data/"
train_file: "train.jsonl"
validation_file: "validation.jsonl"

# Output Configuration
output_dir: "models/extractive_model"
checkpoint_dir: "checkpoints/extractive"
log_dir: "logs/extractive"

# SQuAD Pretraining Configuration (optional)
squad_pretrain: false
squad_epochs: 1
squad_dataset: "squad"

# Inference Configuration
max_span_length: 100
confidence_threshold: 0.5
