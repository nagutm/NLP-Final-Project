# Refinement Model Configuration
# Fine-tunes FLAN-T5 to refine extractive spoiler predictions

# Model settings
model_name: "google/flan-t5-base"  # 250M parameters
max_input_length: 512              # Max tokens for input (extractive output)
max_output_length: 128             # Max tokens for refined output

# Training settings
output_dir: "models/refinement"
checkpoint_dir: "models/refinement/checkpoints"
log_dir: "models/refinement/logs"

num_epochs: 3
batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 5.0e-5              # Slightly higher than extractive (faster adaptation)
weight_decay: 0.01
warmup_steps: 300
max_grad_norm: 1.0

# Data settings
data_dir: "data"
refinement_data_file: "processed/refinement_pairs.json"  # Generated by create_training_data.py

# Extractive model (for generating training data)
extractive_model_path: "models/extractive/final_model"
train_file: "train.jsonl"
validation_file: "validation.jsonl"

# Prompt template
# Options: "simple", "with_type", "explicit"
prompt_style: "simple"

# Training options
use_type_specific: false           # Set to true to train separate models per type
save_total_limit: 2                # Keep only best 2 checkpoints
evaluation_strategy: "epoch"
save_strategy: "epoch"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"

# Reproducibility
seed: 42

# Performance
fp16: true                         # Use mixed precision if GPU available
dataloader_num_workers: 4

# Optional: subsample for testing (1.0 = use all data)
dataset_fraction: 0.005